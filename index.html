<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Viva/ cadastro e catalogo</title>
<link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
<header>
    <h1>Gerenciamento de Livros</h1>
    <nav>
        
            <nav>
                <a href="/frontend/cadastro.html">cadastro</a>

                <a href="/frontend/listagem.html">catalogo</a>
        
    </nav>
</header>

<main>
    <h1>gerenciamento de livros</h1>
    <form id="cadastro">
        <h2>Cadastro de Livros</h2>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" required>

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" required>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" required>

        <label for="quantidade-em-estoque">quantidade em estoque:</label>
        <input type="number" id="quantidade-em-estoque" name="quantidade-em-estoque" required>

        <button type="submit">Cadastrar</button>
        <div></div>
        </form> 
        <forrm id="catalogo">
            <h2>Catalogo de Livros</h2>

            <input type="text" placeholder="buscar por parte do titulo" required id="titulobusca">
            <button type="submit">Buscar</button>
            <button type="reset">Limpar</button>

            <form id="catalogo">
                <table id="tabela-catalogo">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Preço</th>
                            <th>Quantidade em Estoque</th>
                        </tr>
                    </thead>
                    <tbody>
    
                    </tbody>
                </table>
            </form>
        </forrm>
    </main>
    <footer>
        <p>&copy; estante viva gerenciamento de catalogo</p>
</body>
